name: Trigger auto deployment for rag-backend

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]   
    paths:
    - 'backend/**'
    - '.github/workflows/rag-backend-AutoDeployTrigger-f12f006d-49b1-408e-a3bf-d0952976f3d7.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.RAGBACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.RAGBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.RAGBACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/backend
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: narcacr.azurecr.io
          registryUsername: ${{ secrets.RAGBACKEND_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.RAGBACKEND_REGISTRY_PASSWORD }}
          containerAppName: rag-backend
          resourceGroup: narc-rg
          imageToBuild: narcacr.azurecr.io/rag-backend:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


